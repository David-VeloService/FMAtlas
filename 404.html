<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Pagina niet gevonden — FM Atlas</title>
<meta name="description" content="Deze pagina bestaat niet (meer). Ga terug naar FM Atlas."/>
<link rel="icon" type="image/svg+xml" href="/logo.svg"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#fbf3e2; --ink:#0e0d10; --ink-soft:#3d3a45;
    --muted:#8a8474; --line:#e8dcbe;
    --accent:#ff5a2f; --accent-deep:#c43512;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Nunito',system-ui,sans-serif;font-weight:700;
    -webkit-font-smoothing:antialiased;line-height:1.5;
    display:grid;place-items:center;padding:24px;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:32px 32px;
  }
  .card{
    max-width:520px;width:100%;
    background:#fff;border:1.5px solid var(--line);border-radius:18px;
    padding:40px 32px;text-align:center;
    box-shadow:0 6px 24px rgba(14,13,16,0.06);
  }
  .code{
    display:inline-block;font-size:12px;letter-spacing:0.12em;
    color:var(--muted);font-weight:800;text-transform:uppercase;
    margin-bottom:16px;
  }
  h1{font-size:28px;line-height:1.2;margin-bottom:12px}
  p{color:var(--ink-soft);font-weight:600;margin-bottom:24px}
  .btn{
    display:inline-block;background:var(--accent);color:#fff;
    padding:12px 22px;border-radius:12px;font-weight:800;
    font-size:15px;transition:background .15s ease;
    text-decoration:none;
  }
  .btn:hover{background:var(--accent-deep)}
  .links{margin-top:18px;font-size:13px;color:var(--muted);font-weight:600}
  .links a{color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;margin:0 6px}
</style>
</head>
<body>
  <div class="card">
    <span class="code">404</span>
    <h1>Deze pagina bestaat niet (meer)</h1>
    <p>De link is verouderd of bevat een typo. Ga terug naar de homepage en zoek je vak opnieuw op.</p>
    <a href="/" class="btn">Terug naar FM Atlas</a>
    <div class="links">
      <a href="/app.html">Of direct naar de app</a>
    </div>
  </div>
</body>
</html>
