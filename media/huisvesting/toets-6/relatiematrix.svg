<svg xmlns="http://www.w3.org/2000/svg" width="720" height="400" viewBox="0 0 720 400" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif">
<rect width="720" height="400" fill="#fff"/>
<text x="24" y="32" font-size="18" font-weight="700" fill="#222">Relatiematrix kantoorverdieping</text>
<g font-size="14" fill="#222">
<text x="24" y="100">Receptie</text><text x="24" y="150">Werkcafé</text><text x="24" y="200">Open werkplekken</text><text x="24" y="250">Stilteruimte</text><text x="24" y="300">Directie</text>
</g>
<g font-size="13" fill="#222" text-anchor="middle">
<text x="230" y="66">Receptie</text><text x="320" y="66">Werkcafé</text><text x="410" y="58">Open</text><text x="410" y="72">werkplekken</text><text x="500" y="66">Stilteruimte</text><text x="590" y="66">Directie</text>
</g>
<g stroke="#bbb" fill="none">
<rect x="185" y="80" width="450" height="250"/>
<line x1="185" y1="130" x2="635" y2="130"/><line x1="185" y1="180" x2="635" y2="180"/><line x1="185" y1="230" x2="635" y2="230"/><line x1="185" y1="280" x2="635" y2="280"/>
<line x1="275" y1="80" x2="275" y2="330"/><line x1="365" y1="80" x2="365" y2="330"/><line x1="455" y1="80" x2="455" y2="330"/><line x1="545" y1="80" x2="545" y2="330"/>
</g>
<g fill="#eee"><rect x="186" y="81" width="89" height="49"/><rect x="276" y="131" width="89" height="49"/><rect x="366" y="181" width="89" height="49"/><rect x="456" y="231" width="89" height="49"/><rect x="546" y="281" width="89" height="49"/></g>
<g font-size="20" font-weight="700" text-anchor="middle">
<text x="320" y="112" fill="#1f7a3a">p</text><text x="410" y="112" fill="#b07d00">s</text><text x="500" y="112" fill="#c0392b">a</text><text x="590" y="112" fill="#b07d00">s</text>
<text x="410" y="162" fill="#1f7a3a">p</text><text x="500" y="162" fill="#c0392b">a</text><text x="590" y="162" fill="#c0392b">a</text>
<text x="500" y="212" fill="#1f7a3a">p</text><text x="590" y="212" fill="#b07d00">s</text>
<text x="590" y="262" fill="#b07d00">s</text>
</g>
<g font-size="13" fill="#222"><text x="24" y="360"><tspan fill="#1f7a3a" font-weight="700">p</tspan> = primaire relatie: naast elkaar   <tspan fill="#b07d00" font-weight="700">s</tspan> = secundaire relatie: dichtbij, zelfde verdieping   <tspan fill="#c0392b" font-weight="700">a</tspan> = anti-relatie: niet bij elkaar</text></g>
</svg>
