<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Begrippenlijst Inkoopmanagement — FM Kompas</title>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:hsl(0,0%,7%); --fg:hsl(0,0%,100%);
      --card:hsl(0,0%,9%); --card2:hsl(0,0%,11%);
      --primary:hsl(235,100%,60%);
      --muted:hsl(0,0%,56%); --border:rgba(255,255,255,0.10);
      --primary-soft:rgba(91,91,255,0.12); --primary-border:rgba(91,91,255,0.30);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Geist','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--fg);padding-bottom:4rem}
    .fm-header{position:sticky;top:0;z-index:200;height:60px;background:rgba(18,18,18,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 1.25rem;gap:1rem}
    .header-left{display:flex;align-items:center;gap:.9rem;min-width:0}
    .back-link{color:var(--muted);font-size:.82rem;font-weight:500;text-decoration:none;white-space:nowrap;transition:color .15s}
    .back-link:hover{color:var(--fg)}
    .page-title{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .page-title span{color:var(--muted);font-weight:400}
    .searchbar{position:sticky;top:60px;z-index:100;background:rgba(18,18,18,0.95);border-bottom:1px solid var(--border);padding:.75rem 1.5rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
    .searchbar h2{font-size:1rem;font-weight:700;white-space:nowrap}
    #searchbox{flex:1;min-width:180px;padding:.45rem .9rem;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,0.05);color:var(--fg);font-size:.95rem;font-family:inherit;outline:none;transition:border-color .15s}
    #searchbox::placeholder{color:var(--muted)}
    #searchbox:focus{border-color:var(--primary)}
    #counter{font-size:.8rem;color:var(--muted);white-space:nowrap}
    .catmenu{display:flex;gap:.5rem;flex-wrap:wrap;padding:1rem 1.5rem .25rem;max-width:1100px;margin:0 auto}
    .catbtn{padding:.35rem .85rem;border-radius:999px;border:1px solid var(--border);font-size:.8rem;font-weight:700;cursor:pointer;transition:all .15s;background:var(--card2);color:var(--muted);font-family:inherit}
    .catbtn:hover{background:rgba(255,255,255,0.08);color:var(--fg)}
    .catbtn.active{color:#fff;border-color:transparent}
    .container{max-width:1100px;margin:0 auto;padding:1rem 1.5rem}
    .section{margin-bottom:2.5rem}
    .section-title{font-size:1rem;font-weight:800;padding:.55rem 1rem;border-radius:10px;margin-bottom:.75rem;display:flex;align-items:center;gap:.5rem}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.75rem}
    .card{background:var(--card);border-radius:12px;padding:1rem 1.2rem;border:1px solid var(--border);border-left:4px solid rgba(255,255,255,0.08);transition:border-color .15s}
    .card:hover{border-color:rgba(255,255,255,0.18)}
    .card.hidden{display:none}
    .term{font-weight:700;font-size:.95rem;color:var(--fg);margin-bottom:.3rem}
    .def{font-size:.86rem;color:var(--muted);line-height:1.55}
    .formula{display:inline-block;background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:6px;padding:.2rem .5rem;font-family:monospace;font-size:.83rem;color:var(--fg);margin-top:.3rem}
    .art{display:inline;background:var(--primary-soft);border:1px solid var(--primary-border);border-radius:3px;padding:.05rem .35rem;font-size:.77rem;font-weight:600;color:hsl(235,100%,75%)}

    /* Categoriekleuren */
    .cat-basis .section-title{background:rgba(59,130,246,0.15);color:#93c5fd;border:1px solid rgba(59,130,246,0.25)}
    .cat-basis .card{border-left-color:#3b82f6}
    .cat-basis .catbtn.active{background:#3b82f6;border-color:#3b82f6}

    .cat-vanweele .section-title{background:rgba(34,197,94,0.12);color:#86efac;border:1px solid rgba(34,197,94,0.22)}
    .cat-vanweele .card{border-left-color:#22c55e}
    .cat-vanweele .catbtn.active{background:#22c55e;border-color:#22c55e;color:#0f1f14}

    .cat-tactisch .section-title{background:rgba(234,179,8,0.14);color:#fde68a;border:1px solid rgba(234,179,8,0.24)}
    .cat-tactisch .card{border-left-color:#eab308}
    .cat-tactisch .catbtn.active{background:#ca8a04;border-color:#ca8a04}

    .cat-operationeel .section-title{background:rgba(139,92,246,0.15);color:#c4b5fd;border:1px solid rgba(139,92,246,0.25)}
    .cat-operationeel .card{border-left-color:#8b5cf6}
    .cat-operationeel .catbtn.active{background:#8b5cf6;border-color:#8b5cf6}

    .cat-strategie .section-title{background:rgba(249,115,22,0.13);color:#fdba74;border:1px solid rgba(249,115,22,0.23)}
    .cat-strategie .card{border-left-color:#f97316}
    .cat-strategie .catbtn.active{background:#f97316;border-color:#f97316;color:#1a0a00}

    .cat-markt .section-title{background:rgba(236,72,153,0.13);color:#f9a8d4;border:1px solid rgba(236,72,153,0.23)}
    .cat-markt .card{border-left-color:#ec4899}
    .cat-markt .catbtn.active{background:#ec4899;border-color:#ec4899}

    .cat-digitaal .section-title{background:rgba(6,182,212,0.13);color:#67e8f9;border:1px solid rgba(6,182,212,0.23)}
    .cat-digitaal .card{border-left-color:#06b6d4}
    .cat-digitaal .catbtn.active{background:#06b6d4;border-color:#06b6d4;color:#001a1f}

    #noResults{display:none;text-align:center;color:var(--muted);padding:3rem;font-size:1rem}
  </style>
</head>

    <span class="page-title">Inkoopmanagement <span>/ Begrippenlijst</span></span>

<div class="searchbar">
  <h2>📖 Begrippenlijst Inkoop</h2>

<script>
const data = [

  /* ══════════════════════════════════════════
     1. BASISPRINCIPES (Week 1)
  ══════════════════════════════════════════ */
  {cat:"basis", term:"Inkoop",
   def:"Het van externe bronnen betrekken van alle goederen en diensten die noodzakelijk zijn voor de bedrijfsvoering en de instandhouding van een organisatie, tegen de meest gunstige voorwaarden."},
  {cat:"basis", term:"Inkoopfunctie",
   def:"Het organisatiebrede proces van inkoop — omvat meer dan alleen de inkoopafdeling. Factuurafhandeling (Finance), inhuren tijdelijk personeel (HRM) en boeken van transport (Logistiek) vallen buiten de afdeling maar zijn onderdeel van de inkoopfunctie."},
  {cat:"basis", term:"Spin in het web",
   def:"Metafoor voor de inkoper: inkoop raakt alle bedrijfsfuncties en vormt de schakel tussen de interne organisatie en de externe leveranciersmarkt."},
  {cat:"basis", term:"Primaire (directe) inkoop",
   def:"Inkoop van goederen en diensten die rechtstreeks terechtkomen in het eindproduct of de kernactiviteit van de organisatie. Bijv. grondstoffen voor een fabriek, medicijnen in een ziekenhuis."},
  {cat:"basis", term:"Indirecte inkoop / Facilitaire inkoop",
   def:"Alle inkoop voor het functioneren van de organisatie in het algemeen, los van het primaire proces. Bijv. schoonmaak, catering, beveiliging, ICT, bedrijfskleding. Dit is het werkterrein van de Facility Manager."},
  {cat:"basis", term:"MRO (Maintenance, Repair & Operations)",
   def:"Goederen en activiteiten die nodig zijn voor het dagelijkse onderhoud, reparatie en functioneren van een organisatie. Synoniem voor indirecte/facilitaire inkoop."},
  {cat:"basis", term:"Inkoopquote",
   def:"Percentage van de omzet dat besteed wordt aan inkoop. Formule: (totale inkoopkosten / totale omzet) × 100%",
   formula:"Inkoopquote = (inkoopkosten / omzet) × 100%"},
  {cat:"basis", term:"Hefboomwerking van inkoop",
   def:"Bij een inkoopquote van 50% en nettomarge van 5% levert 1% inkoopbesparing evenveel resultaatverbetering op als ±10% omzetgroei. Inkoop heeft directe invloed op het bedrijfsresultaat."},
  {cat:"basis", term:"Make-or-buy beslissing",
   def:"De meest fundamentele strategische inkoopbeslissing: voert de organisatie een activiteit zelf uit (make) of koopt ze die in bij een externe partij (buy)? Kernactiviteiten worden vaak intern gehouden; ondersteunende activiteiten zijn kandidaten voor uitbesteding."},
  {cat:"basis", term:"Maverick buying",
   def:"Medewerkers die buiten de gesloten contracten om inkopen. Gevolg: volume- en kortingsvoordelen gaan verloren, administratieve chaos en een slechtere onderhandelingspositie bij de volgende aanbesteding."},
  {cat:"basis", term:"Publieke inkoop",
   def:"Inkoop door overheidsorganisaties (gemeente, ziekenhuis, school, ministerie). Gericht op maatschappelijke doelstellingen. Boven drempelwaarden verplicht Europees aanbesteden met gelijke kansen voor leveranciers."},
  {cat:"basis", term:"Private inkoop",
   def:"Inkoop door private organisaties (bedrijven, instellingen). Gericht op winst of continuïteit. Vrij in leverancierskeuze en onderhandelingswijze."},
  {cat:"basis", term:"Aanbesteding",
   def:"Formeel proces waarmee een opdrachtgever de markt benadert om leveranciers te selecteren. Verplicht bij publieke organisaties boven bepaalde drempelwaarden. Garandeert gelijke behandeling van inschrijvers."},
  {cat:"basis", term:"Centrale inkoop",
   def:"Één centrale afdeling is verantwoordelijk voor alle inkoop van de organisatie. Voordeel: maximale schaalvoordelen en uniforme contracten. Nadeel: ver van de business, beperkte lokale zeggenschap."},
  {cat:"basis", term:"Decentrale inkoop",
   def:"Afdelingen of businessunits kopen zelf in. Voordeel: lokale kennis en betrokkenheid. Nadeel: verlies van schaalvoordelen en mogelijk hogere prijzen per eenheid."},
  {cat:"basis", term:"Hybride inkoop (coördinatie)",
   def:"Combinatie van centrale regie en decentrale uitvoering. Een inkoopcoördinator bewaakt de kaders terwijl afdelingen lokaal inkopen. Combineert schaalvoordelen met flexibiliteit."},
  {cat:"basis", term:"Vier primaire taken van inkoop",
   def:"1. Operationele excellentie (continuïteit), 2. Realiseren van inkoopbesparingen, 3. Verminderen van risico's in de toeleveringsketen, 4. Bijdragen aan innovatie en waardecreatie."},
  {cat:"basis", term:"Organisatie-inkoop vs. consumenteninkoop",
   def:"Organisatie-inkoop is overwegend rationeel, gestructureerd en langdurig. Consumenteninkoop is vaker emotioneel, impulsief en kortdurend. Inkopen voor organisaties vereist specifieke expertise en andere aanpak."},

  /* ══════════════════════════════════════════
     2. VAN WEELE — 6 STAPPEN (Week 2-3)
  ══════════════════════════════════════════ */
  {cat:"vanweele", term:"Lineair inkoopproces van Van Weele",
   def:"Het inkoopproces bestaat uit zes stappen: 1. Specificeren → 2. Selecteren → 3. Contracteren (tactisch, éénmalig) → 4. Bestellen → 5. Bewaken → 6. Nazorg & Evaluatie (operationeel, herhaald)."},
  {cat:"vanweele", term:"Tactische inkoop (stappen 1-3)",
   def:"De éénmalige, strategische fase van het inkoopproces: specificeren, selecteren en contracteren. Bepaalt wat, bij wie en onder welke voorwaarden wordt ingekocht."},
  {cat:"vanweele", term:"Operationele inkoop (stappen 4-6)",
   def:"De herhaalde, uitvoerende fase van het inkoopproces: bestellen, bewaken en nazorg & evaluatie. Wordt gedurende de looptijd van een contract steeds opnieuw doorlopen."},
  {cat:"vanweele", term:"Stap 1: Specificeren",
   def:"Bepalen wát er ingekocht moet worden. Primair de verantwoordelijkheid van de gebruiker/budgethouder. De inkoper zorgt dat de specificatie objectief, leveranciersneutraal en eenduidig is."},
  {cat:"vanweele", term:"Stap 2: Selecteren",
   def:"Het in kaart brengen van de markt, opstellen van shortlist, aanvragen van offertes (RFQ) en kiezen van de meest geschikte leverancier op basis van een gestructureerde beoordelingsmethode."},
  {cat:"vanweele", term:"Stap 3: Contracteren",
   def:"Onderhandelen over prijs en voorwaarden, en de afspraken vastleggen in een contract. Bevat afspraken over prijs, kwaliteit, levering, KPI's, SLA's en exitclausules."},
  {cat:"vanweele", term:"Stap 4: Bestellen",
   def:"Het plaatsen van een inkooporder bij de gecontracteerde leverancier. De inkooporder is de officiële bevestiging van een bestelling met alle relevante gegevens."},
  {cat:"vanweele", term:"Stap 5: Bewaken (orderbewaking)",
   def:"Toezicht houden op tijdige, volledige levering op het afgesproken leverpunt, met de afgesproken documenten. Drie methoden: exception expediting, routine statuscheck, advanced statuscheck."},
  {cat:"vanweele", term:"Stap 6: Nazorg & Evaluatie",
   def:"Factuurcontrole via three-way matching, afhandeling van reclames en leveranciersbeoordeling. Basis voor toekomstige selectiebeslissingen."},

  /* ══════════════════════════════════════════
     3. TACTISCHE INKOOP — BEGRIPPEN (Week 2)
  ══════════════════════════════════════════ */
  {cat:"tactisch", term:"Functionele specificatie",
   def:"Beschrijft wát een product of dienst moet doen (niet hóe). Geeft leveranciers ruimte voor creatieve oplossingen. Voorbeeld: 'De ruimte moet schoon zijn.'"},
  {cat:"tactisch", term:"Programma van Eisen (PvE)",
   def:"Verdere detaillering van de functionele specificatie met SMART-geformuleerde eisen, richtbudget en randvoorwaarden. Bevat prestatie-, technische, kwaliteits-, logistieke en duurzaamheidseisen."},
  {cat:"tactisch", term:"Technische specificatie",
   def:"Uitwerking van alle specifieke technische eisen: maatvoering, materialen, normen, levertijden, certificeringen. Het meest gedetailleerde niveau van specificeren."},
  {cat:"tactisch", term:"Eisen vs. wensen",
   def:"Eisen zijn knock-outcriteria — leveranciers die niet aan eisen voldoen worden uitgesloten. Wensen zijn nice-to-have criteria die wél meewegen in de beoordeling maar niet elimineren."},
  {cat:"tactisch", term:"Best Value Procurement (BVP)",
   def:"Inkoopstrategie waarbij de nadruk ligt op de best mogelijke waarde, niet op de laagste prijs. De aanbieder die de meeste waarde levert voor de gevraagde prijs wint, ook als dat niet de goedkoopste is."},
  {cat:"tactisch", term:"RFI (Request for Information)",
   def:"Informatieverzoek aan potentiële leveranciers in de oriëntatiefase. Niet bindend. Gebruikt voor marktconsultatie en prekwalificatie: longlist → shortlist."},
  {cat:"tactisch", term:"RFQ (Request for Quotation)",
   def:"Formele offerteaanvraag bij de shortlist van leveranciers. Bindend bij gunning. Bevat alle eisen en criteria waarop beoordeeld wordt."},
  {cat:"tactisch", term:"Prekwalificatie",
   def:"Toetsen of potentiële leveranciers voldoen aan basisvereisten (financiële stabiliteit, certificeringen, referenties) vóórdat een formele offerteaanvraag wordt gedaan. Longlist → shortlist."},
  {cat:"tactisch", term:"Gewogen factorscore / BPKV",
   def:"Offertebeoordelingsmethode waarbij meerdere criteria elk een wegingsfactor krijgen. Scores per criterium worden gewogen opgeteld. Meest gebruikt bij complexe aankopen. BPKV = Best Price to Quality Value."},
  {cat:"tactisch", term:"Indexmethode",
   def:"Offertebeoordelingsmethode waarbij een vaste prijs/kwaliteitsverhouding is vastgesteld (bijv. 50/50). 1% hogere kwaliteit rechtvaardigt 1% hogere prijs."},
  {cat:"tactisch", term:"Waardering in euro's",
   def:"Offertebeoordelingsmethode waarbij kwaliteitsverschillen worden uitgedrukt in euro's en in mindering worden gebracht op de aangeboden prijs. De laagste gecorrigeerde prijs wint."},
  {cat:"tactisch", term:"Accountportfolio",
   def:"Spiegel van de Kraljic-matrix vanuit leveranciersperspectief: hoe segmenteert de leverancier zijn klanten? Core account (hoge omzet, strategisch), Development account (groeiend), Nuisance account (kleine klant, hoge behoefte)."},
  {cat:"tactisch", term:"Resultaatcontract",
   def:"Contract waarbij de leverancier een concreet resultaat garandeert. Betaling is gekoppeld aan het resultaat. Makkelijker toetsbaar — voorkeur van de inkoper."},
  {cat:"tactisch", term:"Inspanningscontract",
   def:"Contract waarbij de leverancier zich inspant maar geen resultaat garandeert (bijv. advocaat, adviseur). Van toepassing als het eindresultaat moeilijk van tevoren te definiëren is."},
  {cat:"tactisch", term:"Vaste prijs (fixed price)",
   def:"Contractvorm waarbij de prijs vooraf is vastgesteld. Het financiële risico ligt bij de leverancier. Vereist een volledig en gedetailleerd PvE."},
  {cat:"tactisch", term:"Regiecontract",
   def:"Contractvorm waarbij achteraf wordt verrekend op basis van uren en materialen. Financieel risico ligt bij de opdrachtgever. Biedt de leverancier geen prikkel voor efficiëntie."},
  {cat:"tactisch", term:"Eenheidsprijscontract",
   def:"Contractvorm met een tarief per prestatie-eenheid (m², uur, stuk). Geschikt voor standaard terugkerende werkzaamheden waarbij volume vooraf onbekend is."},
  {cat:"tactisch", term:"SLA (Service Level Agreement)",
   def:"Meetbare prestatieafspraken over het niveau van dienstverlening. Onderdeel van het contract. Basis voor het beoordelen van de leverancier tijdens de operationele fase."},
  {cat:"tactisch", term:"KPI (Key Performance Indicator)",
   def:"Prestatie-indicator waarmee de kwaliteit van levering wordt gemeten. Wordt gebruikt bij orderbewaking, leveranciersevaluatie en contractmanagement."},
  {cat:"tactisch", term:"Salamitactiek",
   def:"Onderhandelingstactiek waarbij in kleine stappen concessies worden verkregen, zodat de wederpartij niet in één keer het totale verlies ziet."},
  {cat:"tactisch", term:"TCO (Total Cost of Ownership)",
   def:"Alle kosten verbonden aan de aanschaf, het bezit en de afdanking van een product of dienst over de volledige levenscyclus. Omvat pre-transactie-, transactie- en post-transactiekosten — nadrukkelijk niet alleen de aanschafprijs.",
   formula:"TCO = pre-transactie + transactie + post-transactiekosten"},

  /* ══════════════════════════════════════════
     4. OPERATIONELE INKOOP (Week 3)
  ══════════════════════════════════════════ */
  {cat:"operationeel", term:"Inkooporder",
   def:"Officieel document waarmee de koper een bestelling plaatst bij een leverancier na ondertekening van het contract. Bevestigt wat besteld is, hoeveel, tegen welke prijs en wanneer geleverd."},
  {cat:"operationeel", term:"Roundtrip bestelling",
   def:"Bestelwijze waarbij de medewerker winkelt in de webshop van de leverancier; het winkelmandje wordt teruggezonden naar het interne bestelsysteem voor goedkeuring door de budgethouder."},
  {cat:"operationeel", term:"Catalogusbestelling",
   def:"Bestelwijze waarbij de medewerker winkelt in een interne catalogus binnen het bestelsysteem. Snelle route: direct naar budgethouder ter goedkeuring."},
  {cat:"operationeel", term:"Vrije aanvraag",
   def:"Bestelwijze voor niet-standaard bestellingen waarbij de medewerker alle gegevens zelf invult. Langste route: eerst langs Inkoop en Bedrijfsbureau, dan naar budgethouder."},
  {cat:"operationeel", term:"Exception expediting (piepsysteem)",
   def:"Reactieve bewakingsmethode waarbij de inkoper pas actie onderneemt na een probleemsignaal. Nadeel: inkoper loopt altijd achter de feiten aan, wat leidt tot spoedorders en buffervoorraden."},
  {cat:"operationeel", term:"Routine statuscheck",
   def:"Proactieve bewakingsmethode waarbij de inkoper enkele dagen vóór de leverdatum contact opneemt om leverdatum en volledigheid te bevestigen. Eenvoudig en effectief."},
  {cat:"operationeel", term:"Advanced statuscheck",
   def:"Meest proactieve bewakingsmethode: kritische leveranciers geven een gedetailleerde productieplanning; periodieke voortgangstoetsing, evt. permanente inspecteurs op locatie. Geschikt voor kritische componenten."},
  {cat:"operationeel", term:"Ontvangstcontrole",
   def:"Controle bij binnenkomst van een levering op: artikelen en aantallen (manco), kwaliteit (zichtbaar of via laboratorium), logistiek (verpakking, tijd, transportmiddel) en documentatie."},
  {cat:"operationeel", term:"Three-way matching",
   def:"Vergelijking van drie documenten vóórdat een factuur betaalbaar wordt gesteld: (1) inkooporder, (2) afleveringsbon, (3) factuur. Alleen bij overeenstemming wordt betaald. Voorkomt betalen voor niet-geleverde of te duur gefactureerde goederen."},
  {cat:"operationeel", term:"Leveranciersevaluatie",
   def:"Periodieke beoordeling van een leverancier op kwaliteit, leveringsbetrouwbaarheid, communicatie en prijs-kwaliteitsverhouding. Basis voor toekomstige selectiebeslissingen en contractverlengingen."},

  /* ══════════════════════════════════════════
     5. STRATEGIE — CONTRACT, SPEND, KRALJIC (Week 4)
  ══════════════════════════════════════════ */
  {cat:"strategie", term:"Uitbesteden (outsourcing)",
   def:"Strategische overdracht van intern uitgevoerde activiteiten aan een externe partij voor een langere termijn (3-7 jaar). Kenmerken: bedrijfsmiddelen gaan over, intensieve relatie, nieuw kosten- én risicoprofiel."},
  {cat:"strategie", term:"Contractmanagement",
   def:"Het geheel van activiteiten gericht op het wederzijds doen nakomen van afspraken tussen leveranciers en opdrachtgevers, zodanig dat maximale waarde voor de organisatie wordt gecreëerd. Bestaat uit contractbeheer + prestatiemanagement."},
  {cat:"strategie", term:"Contractbeheer",
   def:"Administratief beheren en archiveren van contracten. Bijhouden van expiratiedata, mutaties en stuurinformatie. Doel: interne organisatie voorzien van actuele contractinformatie."},
  {cat:"strategie", term:"Prestatiemanagement",
   def:"Actief monitoren en sturen op afgesproken prestaties (KPI's en SLA's). Periodieke evaluatiegesprekken met leveranciers gericht op continue verbetering."},
  {cat:"strategie", term:"Leveranciersmanagement",
   def:"Alle activiteiten gericht op het verkennen, selecteren, starten, onderhouden, ontwikkelen en beëindigen van leveranciersrelaties. Doel: continu optimale bijdrage aan organisatiedoelstellingen. Gaat verder dan contractmanagement — omvat ook co-innovatie en partnership."},
  {cat:"strategie", term:"Spendanalyse",
   def:"Financiële analyse naar de daadwerkelijke inkoopuitgaven van een organisatie. Beantwoordt acht vragen: wat, hoeveel, bij wie, hoe vaak, welke afdeling, maverick buying-aandeel, aantal facturen, gemiddelde factuurwaarde."},
  {cat:"strategie", term:"ABC-analyse",
   def:"Indeling van leveranciers of artikelen in drie categorieën op basis van inkoopomzet. A: ~20% leveranciers, ~80% omzet. B: ~30% leveranciers, ~15% omzet. C: ~50% leveranciers, ~5% omzet."},
  {cat:"strategie", term:"Pareto-principe (80/20-regel)",
   def:"Empirisch principe: 20% van de leveranciers is verantwoordelijk voor 80% van de inkoopuitgaven. Basis voor de ABC-analyse en prioritering van inkoopactiviteiten."},
  {cat:"strategie", term:"Kraljic-matrix",
   def:"Portfoliomodel waarbij inkopen worden ingedeeld op basis van financiële invloed (hoog/laag) × toeleveringsrisico (hoog/laag). Geeft vier kwadranten: strategisch, hefboom, knelpunt en routine — elk met een eigen strategie."},
  {cat:"strategie", term:"Strategische producten (Kraljic)",
   def:"Hoog toeleveringsrisico + hoge financiële invloed. Van één leverancier; grote waarde in kostprijs. Bijv. motoren autofabriek, IT-mainframes. Strategie: strategic partnership, open calculatie, co-innovatie."},
  {cat:"strategie", term:"Hefboomproducten (Kraljic)",
   def:"Laag toeleveringsrisico + hoge financiële invloed. Van meerdere leveranciers; grote waarde; kleine prijswijziging heeft groot effect. Bijv. bulkchemicaliën, grondstoffen. Strategie: concurrentiestelling, breed uitvragen."},
  {cat:"strategie", term:"Knelpuntproducten (Kraljic)",
   def:"Hoog toeleveringsrisico + lage financiële invloed. Van één leverancier; relatief geringe waarde maar kwetsbaar. Bijv. machine-specifieke reserveonderdelen. Strategie: veiligstellen toelevering, buffervoorraden."},
  {cat:"strategie", term:"Routineproducten (Kraljic)",
   def:"Laag toeleveringsrisico + lage financiële invloed. Van veel leveranciers; geringe waarde per eenheid; meeste producten vallen hieronder. Bijv. kantoorartikelen, schoonmaakmiddelen. Strategie: digitaliseren en automatiseren."},
  {cat:"strategie", term:"Exitafspraken",
   def:"Contractuele bepalingen over hoe een samenwerking beëindigd kan worden: overdrachtsperiode, eigendom van data en bedrijfsmiddelen, kennisoverdracht. Essentieel bij uitbesteding om vendor lock-in te voorkomen."},

  /* ══════════════════════════════════════════
     6. INKOOPMARKTONDERZOEK & PMI (Week 5)
  ══════════════════════════════════════════ */
  {cat:"markt", term:"Inkoopmarktonderzoek",
   def:"Systematisch onderzoek naar alle relevante factoren die de verwerving van goederen en diensten beïnvloeden. Doel: huidige en toekomstige behoeften veiligstellen en de concurrentiepositie versterken."},
  {cat:"markt", term:"Macro-economische factoren",
   def:"Algemene economische omgeving: conjunctuur, loonontwikkelingen, rentestand, wetgeving, grondstofprijzen, valuta, inflatie, geopolitieke spanningen. Beïnvloeden prijsontwikkelingen en leveringszekerheid."},
  {cat:"markt", term:"Meso-economische factoren",
   def:"Ontwikkelingen in een specifieke bedrijfstak: vraag-aanbodverhouding, orderportefeuilles, bezettingsgraad, marktstructuur (oligopolie, monopolie, vrije markt). Helpen inschatten hoe 'krap' of 'ruim' de markt is."},
  {cat:"markt", term:"Micro-economische factoren",
   def:"Kenmerken van het individuele leveranciersbedrijf: financiële positie, managementstructuur, leveringsbetrouwbaarheid, kwaliteitsprestaties, kostprijsstructuur. Geeft inzicht in betrouwbaarheid en continuïteitsrisico."},
  {cat:"markt", term:"Productfactoren",
   def:"Factoren die de verkoopprijs en kostprijs van een product of dienst bepalen: technische specs, substituten, standaardisatie, innovatiecyclus, levertijden, certificeringen."},
  {cat:"markt", term:"PMI (Purchasing Managers Index)",
   def:"Indicator voor economische bedrijvigheid, ontleend aan het inkoopvolume dat inkopers in een bepaalde maand contracteren. PMI > 50 = groei; PMI < 50 = krimp. Gepubliceerd door NEVI, iedere eerste werkdag van de maand."},
  {cat:"markt", term:"NEVI",
   def:"Nederlandse Vereniging voor Inkoop Management. Publiceert maandelijks de PMI en is de beroepsvereniging voor inkoopprofessionals in Nederland."},
  {cat:"markt", term:"Dataleveranciers (Graydon, Dun & Bradstreet)",
   def:"Commerciële databedrijven die grote databases beheren met financiële gegevens van bedrijven in EU-landen. Gebruikt om snel een beeld te krijgen van de financiële situatie en kredietwaardigheid van potentiële leveranciers."},

  /* ══════════════════════════════════════════
     7. DIGITALISERING (Week 3)
  ══════════════════════════════════════════ */
  {cat:"digitaal", term:"Inkoopdigitalisering",
   def:"Het gebruik van ICT om klant, leverancier en andere partners in een waardeketen met elkaar te verbinden, zodanig dat de prestaties van transactieprocessen worden verbeterd."},
  {cat:"digitaal", term:"ERP (Enterprise Resource Planning)",
   def:"Geïntegreerd softwaresysteem dat alle bedrijfsprocessen (Finance, Operations, HRM, Inkoop) ondersteunt vanuit één centrale database. Ruggengraat van de informatievoorziening in grotere organisaties. Bekende leveranciers: SAP, Oracle."},
  {cat:"digitaal", term:"AI (Artificial Intelligence) in inkoop",
   def:"Systemen die menselijke intelligentie nabootsen en zichzelf verbeteren via data. Toepassingen in inkoop: chatbots, automatische contractopstelling, forecasting van volumes en prijzen. Voorbeelden: ChatGPT, Copilot, Brainial."},
  {cat:"digitaal", term:"RPA (Robotic Process Automation)",
   def:"Automatisering van repetitieve bedrijfsprocessen via software. Inkoop-toepassing: automatische factuurafhandeling door vergelijking van magazijnsysteem, contractsysteem en crediteurenadministratie (three-way matching)."},
  {cat:"digitaal", term:"Blockchain & Smart Contracts",
   def:"Blockchain = gedistribueerde registratie van data in blokken; geen centrale autoriteit nodig. Smart contracts voeren afspraken automatisch uit bij vooraf bepaalde criteria. Inkoop-toepassing: herkomst producten traceren, automatische betaling bij levering."},
  {cat:"digitaal", term:"IoT (Internet of Things)",
   def:"Apparaten die via internet met elkaar communiceren. Inkoop-toepassing: machine stuurt signaal bij naderende storing → preventief onderhoud bestellen; automatische voorraadbewaking en nabestelling."},
  {cat:"digitaal", term:"Data-analyse & visualisatie",
   def:"Tools (Power BI, Qlikview) die data uit meerdere bronnen combineren en visualiseren. Algoritmen ondersteunen besluitvorming in inkoop: spend-analyse, leveranciersprestaties, contractverloop."},
  {cat:"digitaal", term:"Inkoper van de toekomst",
   def:"De toekomstvisie: operationele inkoop wordt volledig geautomatiseerd door computers. De inkoper wordt een businessanalist die zich richt op strategie, leveranciersrelaties en innovatie in plaats van routinetransacties."},

];

/* ── Kleurmap per categorie ── */
const catMeta = {
  basis:       {label:"🏗️ Basisprincipes",    cls:"cat-basis"},
  vanweele:    {label:"🔄 Van Weele (6 stappen)", cls:"cat-vanweele"},
  tactisch:    {label:"🎯 Tactische inkoop",   cls:"cat-tactisch"},
  operationeel:{label:"⚙️ Operationele inkoop", cls:"cat-operationeel"},
  strategie:   {label:"🏆 Strategie & Contracten", cls:"cat-strategie"},
  markt:       {label:"📊 Marktonderzoek & PMI", cls:"cat-markt"},
  digitaal:    {label:"💻 Digitalisering",     cls:"cat-digitaal"},
};

let activeCat = "all";
const ORDER = ["basis","vanweele","tactisch","operationeel","strategie","markt","digitaal"];

function render(items){
  const main = document.getElementById("main");
  main.innerHTML = "";
  const grouped = {};
  ORDER.forEach(c => grouped[c] = []);
  items.forEach(it => { if(grouped[it.cat]) grouped[it.cat].push(it); });
  ORDER.forEach(cat => {
    const list = grouped[cat];
    if(!list.length) return;
    const meta = catMeta[cat];
    const sec = document.createElement("div");
    sec.className = `section ${meta.cls}`;
    sec.dataset.cat = cat;
    sec.innerHTML = `<div class="section-title">${meta.label}</div><div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    list.forEach(it => {
      const card = document.createElement("div");
      card.className = "card";
      card.dataset.cat = it.cat;
      card.dataset.term = it.term.toLowerCase();
      card.dataset.def = it.def.toLowerCase();
      card.innerHTML = `<div class="term">${it.term}</div><div class="def">${it.def}</div>${it.formula ? `<div class="formula">${it.formula}</div>` : ""}`;
      grid.appendChild(card);
    });
    main.appendChild(sec);
  });
  updateCounter(items.length);
}

function buildCatMenu(){
  const menu = document.getElementById("catmenu");
  const allBtn = document.createElement("button");
  allBtn.className = "catbtn active";
  allBtn.textContent = "Alle begrippen";
  allBtn.dataset.cat = "all";
  allBtn.style.cssText = "background:hsl(235,100%,60%);color:#fff;border-color:transparent";
  allBtn.onclick = () => { activeCat="all"; updateActive(allBtn); filterAll(); };
  menu.appendChild(allBtn);
  ORDER.forEach(cat => {
    const meta = catMeta[cat];
    const btn = document.createElement("button");
    btn.className = `catbtn ${meta.cls}`;
    btn.dataset.cat = cat;
    btn.textContent = meta.label;
    btn.onclick = () => { activeCat=cat; updateActive(btn); filterAll(); };
    menu.appendChild(btn);
  });
}

function updateActive(activeBtn){
  document.querySelectorAll(".catbtn").forEach(b => b.classList.remove("active"));
  activeBtn.classList.add("active");
  if(activeBtn.dataset.cat === "all") activeBtn.style.cssText = "background:hsl(235,100%,60%);color:#fff;border-color:transparent";
}

function filterAll(){
  const q = document.getElementById("searchbox").value.toLowerCase().trim();
  document.getElementById("searchTerm").textContent = q;
  const filtered = data.filter(it => {
    const matchCat = activeCat === "all" || it.cat === activeCat;
    const matchQ = !q || it.term.toLowerCase().includes(q) || it.def.toLowerCase().includes(q);
    return matchCat && matchQ;
  });
  render(filtered);
  document.getElementById("noResults").style.display = filtered.length ? "none" : "block";
}

function updateCounter(n){ document.getElementById("counter").textContent = `${n} begrip${n===1?"":"pen"}`; }

buildCatMenu();
render(data);
</script>
