<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Begrippentoets · FM Atlas</title>
<meta name="description" content="Oefen de begrippen van een vak: je krijgt een omschrijving en kiest het juiste begrip."/>
<link rel="icon" type="image/svg+xml" href="logo.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#efe5d4"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/atlas.css"/>
<link rel="stylesheet" href="css/leer.css"/>
<link rel="stylesheet" href="css/toets.css"/>
</head>
<body>
<div class="scene" aria-hidden="true"><i></i></div>
<header class="topbar" id="topbar"></header>
<main class="toets">
  <h1 id="toets-title">Begrippentoets</h1>
  <p class="toets-best" id="toets-best" hidden></p>
  <section class="toets-intro glass" id="toets-intro" aria-label="Over deze toets">
    <p>Je krijgt een omschrijving en kiest het begrip dat erbij hoort. Elke ronde geeft een willekeurige selectie uit de begrippenlijst van dit vak.</p>
    <fieldset class="toets-choice" id="toets-settings"><legend>Aantal vragen</legend>
      <label class="glass"><input type="radio" name="bt-n" value="10"/>10 vragen</label>
      <label class="glass"><input type="radio" name="bt-n" value="20" checked/>20 vragen</label>
      <label class="glass"><input type="radio" name="bt-n" value="0"/>Alle begrippen</label>
    </fieldset><p class="toets-status" id="toets-status" role="status">Begrippen laden…</p>
    <div class="toets-actions">
      <button class="toets-btn toets-primary" id="toets-start" type="button" disabled>Begin begrippentoets</button>
      <a class="toets-btn glass toets-back" href="index.html">Terug naar vak</a>
    </div>
  </section>
  <section id="toets-test" aria-label="Vragen" hidden>
    <div class="toets-progress">
      <p id="toets-counter" role="status" aria-live="polite"></p>
      <div class="toets-meter" id="toets-meter" role="progressbar" aria-labelledby="toets-counter" aria-valuemin="0" aria-valuemax="1" aria-valuenow="0"><span id="toets-bar"></span></div>
    </div>
    <article class="toets-question glass" id="toets-question" aria-labelledby="question-title"></article>
    <nav class="toets-nav" aria-label="Vragen doorlopen">
      <button class="toets-btn glass" id="toets-prev" type="button">Vorige</button>
      <button class="toets-btn toets-primary" id="toets-next" type="button">Volgende</button>
    </nav>
  </section>
  <section id="toets-results" aria-labelledby="results-title" hidden>
    <div class="toets-summary glass">
      <h2 id="results-title" tabindex="-1">Je resultaat</h2>
      <p class="toets-score" id="toets-score"></p>
      <p id="toets-verdict"></p>
      <div class="toets-actions">
        <button class="toets-btn toets-primary" id="toets-wrong" type="button">Alleen de foute opnieuw</button>
        <button class="toets-btn glass" id="toets-restart" type="button">Nieuwe ronde</button>
        <button class="toets-btn glass" id="toets-configure" type="button">Aantal vragen kiezen</button>
        <a class="toets-btn glass toets-back" href="index.html">Terug naar vak</a>
      </div>
    </div>
    <ol class="toets-review-list" id="toets-review" aria-label="Antwoorden met uitleg"></ol>
  </section>
  <noscript><p>Schakel JavaScript in om de toets te maken.</p></noscript>
</main>
<dialog class="toets-lightbox" id="toets-lightbox" aria-label="Afbeelding vergroot">
  <button class="toets-btn glass" type="button" id="toets-close">Sluiten</button>
  <figure><img alt=""/><figcaption></figcaption></figure>
</dialog>
<script src="js/atlas-data.js"></script>
<script src="js/atlas.js"></script>

<script>
(() => {
  'use strict';
  const $ = id => document.getElementById(id);
  const esc = Atlas.esc;
  const letter = i => String.fromCharCode(65 + i);
const BT_VAKKEN = {
  /* >>> jaar 2 (gegenereerd door fmatlas-vakken) */
  'facilitaire-bedrijfskunde': { title: 'Facilitaire bedrijfskunde', data: 'js/data-facilitaire-bedrijfskunde.js', ns: 'FBK', key: 'facilitaire-bedrijfskunde', hub: 'facilitaire-bedrijfskunde.html' },
  'fm-tech': { title: 'FM Tech', data: 'js/data-fm-tech.js', ns: 'FMTECH', key: 'fm-tech', hub: 'fm-tech.html' },
  'huisvesting': { title: 'Huisvesting', data: 'js/data-huisvesting.js', ns: 'HUIV', key: 'huisvesting', hub: 'huisvesting.html' },
  'facilitair-verandermanagement': { title: 'Facilitair verandermanagement', data: 'js/data-facilitair-verandermanagement.js', ns: 'FVM', key: 'facilitair-verandermanagement', hub: 'facilitair-verandermanagement.html' },
  'facilitaire-economie-veranderingen': { title: 'Facilitaire economie bij veranderingen', data: 'js/data-facilitaire-economie-veranderingen.js', ns: 'FEV', key: 'facilitaire-economie-veranderingen', hub: 'facilitaire-economie-veranderingen.html' },
  /* <<< jaar 2 */
  'bvfma':                { title: 'Basis van FM A',               data: 'js/data-bvfma.js',                 ns: 'BVFMA',  key: 'basis-van-fm-a',               hub: 'basis-van-fm-a.html' },
  'trendwatchers':        { title: 'Trendwatchers',                data: 'js/data-trendwatchers.js',         ns: 'TRDW',   key: 'trendwatchers',                hub: 'trendwatchers.html' },
  'bvfmb':                { title: 'Basis van FM B',               data: 'js/data-bvfmb.js',                 ns: 'BVFMB',  key: 'basis-fm-b',                   hub: 'basis-van-fm-b.html' },
  'bedrijfseconomie':     { title: 'Facilitaire Bedrijfseconomie', data: 'js/data-bedrijfseconomie.js',      ns: 'BECO',   key: 'facilitaire-bedrijfseconomie', hub: 'bedrijfseconomie.html' },
  'em1':                  { title: 'Eventmanagement 1',            data: 'js/data-em1.js',                   ns: 'EM1',    key: 'eventmanagement1',             hub: 'eventmanagement1.html' },
  'inkoop':               { title: 'Inkoopmanagement',             data: 'js/data-inkoop.js',                ns: 'INKOOP', key: 'facilitaire-inkoop',           hub: 'facilitaire-inkoop.html' },
  'recht':                { title: 'Recht',                        data: 'js/data-recht.js',                 ns: 'RECHT',  key: 'recht',                        hub: 'recht.html' },
  'evenementenlogistiek': { title: 'Evenementenlogistiek',         data: 'js/data-evenementenlogistiek.js',  ns: 'EVLOG',  key: 'evenementenlogistiek',         hub: 'evenementenlogistiek.html' },
  'projectvaardigheden':  { title: 'Projectvaardigheden',          data: 'js/data-projectvaardigheden.js',   ns: 'PVRD',   key: 'projectvaardigheden',          hub: 'projectvaardigheden.html' },
};
  const VAK_ID = new URLSearchParams(location.search).get('vak');
  const VAK = Object.hasOwn(BT_VAKKEN, VAK_ID) ? BT_VAKKEN[VAK_ID] : null;
  let pool = [];
  const count = () => Math.min(Number(document.querySelector('input[name="bt-n"]:checked').value) || pool.length, pool.length);
  const scoreKey = () => VAK && pool.length ? VAK.key + '-begrippentoets-' + count() : null;
  const submitLabel = 'Lever begrippentoets in';
  const verdict = () => 'Lees de uitleg hieronder. In een nieuwe ronde krijg je een andere selectie begrippen.';
  function shuffle(list) {
    for (let i = list.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [list[i], list[j]] = [list[j], list[i]];
    }
    return list;
  }
  function maskTerm(def, term) {
    const parts = [term, term.replace(/\s*\(.*?\)\s*/g, ' ').trim(), ...term.split(/\s*[\/(),]\s*/)]
      .map(p => p.trim()).filter(p => p.length > 3);
    let result = def;
    for (const part of [...new Set(parts)].sort((a, b) => b.length - a.length)) {
      result = result.replace(new RegExp(part.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), '…');
    }
    return result;
  }
  function createQuestions() {
    return shuffle(pool.slice()).slice(0, count()).map((b, i) => {
      const same = shuffle(pool.filter(x => x.term !== b.term && x.cat === b.cat));
      const other = shuffle(pool.filter(x => x.term !== b.term && x.cat !== b.cat));
      const options = shuffle([b.term, ...[...same, ...other].slice(0, 3).map(x => x.term)]);
      return { kind: 'mc', num: i + 1, text: esc(maskTerm(b.def, b.term)), options: options.map(esc), answer: options.indexOf(b.term), explanation: esc(b.def) };
    });
  }
  function init() {
    // De voortgangssleutel blijft behouden; inkoop en recht delen één vakpagina.
    const VAKPAGINA = {"basis-fm-b": "basis-van-fm-b", "bvfma": "basis-van-fm-a", "trendwatchers": "trendwatchers", "bvfmb": "basis-van-fm-b", "bedrijfseconomie": "facilitaire-bedrijfseconomie", "em1": "eventmanagement1", "inkoop": "facilitaire-inkoop", "recht": "facilitaire-inkoop", "evenementenlogistiek": "evenementenlogistiek", "projectvaardigheden": "projectvaardigheden"};
    const back = VAK ? 'vak.html?v=' + encodeURIComponent(VAKPAGINA[VAK.key] || VAK.key) : 'index.html';
    document.querySelectorAll('.toets-back').forEach(link => { link.href = back; });
    Atlas.topbar(VAK ? `<span class="sep">/</span><a href="${esc(back)}">${esc(VAK.title)}</a><span class="sep">/</span><span class="here">Begrippentoets</span>` : '<span class="sep">/</span><span class="here">Begrippentoets</span>');
    if (!VAK) {
      $('toets-status').textContent = 'Kies een vak via het vakkenoverzicht.';
      $('toets-start').hidden = true;
      $('toets-settings').hidden = true;
      document.querySelectorAll('.toets-back').forEach(link => { link.textContent = 'Naar het vakkenoverzicht'; });
      return;
    }
    document.title = `Begrippentoets · ${VAK.title} · FM Atlas`;
    const script = document.createElement('script');
    script.src = VAK.data;
    script.onload = () => {
      const seen = new Set();
      pool = (window[VAK.ns]?.begrippen || []).filter(b => {
        if (typeof b.term !== 'string' || typeof b.def !== 'string' || !b.term.trim() || !b.def.trim() || seen.has(b.term)) return false;
        seen.add(b.term);
        return true;
      });
      $('toets-start').disabled = pool.length < 2;
      $('toets-status').textContent = pool.length < 2 ? 'Dit vak heeft nog niet genoeg begrippen voor een toets.' : `${pool.length} begrippen beschikbaar.`;
      paintBest();
    };
    script.onerror = () => { $('toets-status').textContent = 'De begrippen konden niet laden. Laad de pagina opnieuw om het nog eens te proberen.'; };
    document.body.appendChild(script);
  }


  let questions = [], answers = Object.create(null), current = 0, retry = false, mistakes = [];
  function paintBest() {
    const key = scoreKey();
    Atlas.accountReady.then(account => {
      if (key !== scoreKey()) return;
      const best = key && account?.readTest(key);
      $('toets-best').hidden = !best;
      $('toets-best').textContent = best ? `Beste score: ${best.goed} van ${best.totaal}` : '';
    });
  }
  paintBest();
  window.addEventListener('atlas:toetsen', event => { if (event.detail.key === scoreKey()) paintBest(); });
  function image(q) {
    if (!q.img) return '';
    return `<figure class="beeld"><button type="button" data-image aria-label="Afbeelding bij vraag ${q.num} vergroten"><img src="${esc(q.img)}" alt="${esc(q.alt || 'Afbeelding bij de vraag')}" loading="lazy"/></button><figcaption>${esc(q.alt || 'Afbeelding bij de vraag')}. Klik om te vergroten.</figcaption></figure>`;
  }
  function start(selected = null) {
    questions = selected ? selected.slice() : createQuestions();
    if (!questions.length) return;
    answers = Object.create(null);
    current = 0;
    retry = selected !== null;
    $('toets-intro').hidden = true;
    $('toets-results').hidden = true;
    $('toets-review').replaceChildren();
    $('toets-test').hidden = false;
    render();
  }
  function render() {
    const q = questions[current];
    if (!q) return;
    const state = answers[q.num] || {};
    $('toets-counter').textContent = `Vraag ${current + 1} van ${questions.length}`;
    $('toets-meter').setAttribute('aria-valuemax', questions.length);
    $('toets-meter').setAttribute('aria-valuenow', current + 1);
    $('toets-bar').style.width = (current + 1) / questions.length * 100 + '%';
    $('toets-prev').disabled = current === 0;
    $('toets-next').textContent = current === questions.length - 1 ? submitLabel : 'Volgende';
    $('toets-question').innerHTML = `
      ${q.section ? `<p class="toets-section">${esc(q.section)}</p>` : ''}
      ${q.casus ? `<div class="toets-casus"><strong>Casus</strong>${q.casus}</div>` : ''}
      <h2 id="question-title" tabindex="-1">${q.text}</h2>${image(q)}
      ${q.kind === 'mc' ? `<div class="toets-options" role="group" aria-labelledby="question-title">${q.options.map((option, i) => `
        <button class="toets-option glass" type="button" data-choice="${i}" aria-pressed="${state.choice === i}"><span class="toets-letter">${letter(i)}.</span><span>${option}</span></button>`).join('')}</div>` : `
        <label class="toets-answer-label" for="toets-answer">Jouw antwoord</label>
        <textarea class="toets-answer" id="toets-answer" placeholder="Schrijf je antwoord op voordat je het modelantwoord bekijkt."></textarea>
        <div class="toets-actions"><button class="toets-btn glass" type="button" data-reveal ${state.reveal ? 'hidden' : ''}>Toon modelantwoord</button></div>
        <div class="toets-model" id="toets-model" tabindex="-1" ${state.reveal ? '' : 'hidden'}><h3>Modelantwoord</h3><div>${q.model}</div>
          <div class="toets-mark"><p>Vergelijk je antwoord met het modelantwoord.</p><div class="toets-actions">
            <button class="toets-btn glass" type="button" data-mark="good" aria-pressed="${state.good === true}">Goed</button>
            <button class="toets-btn glass" type="button" data-mark="wrong" aria-pressed="${state.good === false}">Fout</button>
          </div></div>
        </div>`}`;
    if (q.kind === 'open') $('toets-answer').value = state.text || '';
    $('question-title').focus({ preventScroll: true });
    window.scrollTo({ top: 0 });
  }
  $('toets-question').addEventListener('input', event => {
    if (event.target.id === 'toets-answer') {
      (answers[questions[current].num] ||= {}).text = event.target.value;
    }
  });
  $('toets-question').addEventListener('click', event => {
    const q = questions[current];
    const choice = event.target.closest('[data-choice]');
    if (choice) {
      (answers[q.num] ||= {}).choice = Number(choice.dataset.choice);
      $('toets-question').querySelectorAll('[data-choice]').forEach(button => button.setAttribute('aria-pressed', String(button === choice)));
    }
    if (event.target.closest('[data-reveal]')) {
      (answers[q.num] ||= {}).reveal = true;
      $('toets-question').querySelector('[data-reveal]').hidden = true;
      $('toets-model').hidden = false;
      $('toets-model').focus({ preventScroll: true });
    }
    const mark = event.target.closest('[data-mark]');
    if (mark) {
      (answers[q.num] ||= {}).good = mark.dataset.mark === 'good';
      $('toets-question').querySelectorAll('[data-mark]').forEach(button => button.setAttribute('aria-pressed', String(button === mark)));
    }
  });
  const isCorrect = q => q.kind === 'mc' ? answers[q.num]?.choice === q.answer : answers[q.num]?.good === true;
  function submit() {
    const correct = questions.filter(isCorrect).length;
    mistakes = questions.filter(q => !isCorrect(q));
    const pct = Math.round(correct / questions.length * 100);
    $('toets-score').textContent = `Je hebt ${correct} van ${questions.length} vragen goed (${pct}%).`;
    $('toets-verdict').textContent = retry ? 'Dit is het resultaat van je herhaling.' : verdict(pct);
    $('toets-wrong').hidden = mistakes.length === 0;
    $('toets-review').innerHTML = questions.map(q => {
      const state = answers[q.num] || {};
      return `<li class="toets-review glass"><h3>Vraag ${q.num} · ${isCorrect(q) ? 'Goed' : 'Fout'}</h3><div>${q.text}</div>${image(q)}
        ${q.casus ? `<div class="toets-casus"><strong>Casus</strong>${q.casus}</div>` : ''}
        ${q.kind === 'mc' ? `<p><strong>Jouw antwoord:</strong> ${state.choice === undefined ? 'Niet beantwoord' : q.options[state.choice]}</p><p><strong>Juiste antwoord:</strong> ${q.options[q.answer]}</p><div class="toets-explanation">${q.explanation || ''}</div>` : `
          <p class="toets-written"><strong>Jouw antwoord:</strong> ${esc(state.text || 'Niet ingevuld')}</p>${state.good === undefined ? '<p>Niet zelf nagekeken; telt als fout.</p>' : '<p>Door jou nagekeken met het modelantwoord.</p>'}<div class="toets-explanation"><strong>Modelantwoord</strong><br/>${q.model}</div>`}</li>`;
    }).join('');
    $('toets-test').hidden = true;
    $('toets-results').hidden = false;
    if (!retry) {
      const key = scoreKey();
      const result = { goed: correct, totaal: questions.length, laatst: Date.now() };
      Atlas.accountReady.then(account => account?.saveTest(key, result));
    }
    $('results-title').focus({ preventScroll: true });
    window.scrollTo({ top: 0 });
  }
  $('toets-start').addEventListener('click', () => start());
  $('toets-restart').addEventListener('click', () => start());
  $('toets-wrong').addEventListener('click', () => { if (mistakes.length) start(mistakes); });
  $('toets-configure')?.addEventListener('click', () => {
    $('toets-results').hidden = true;
    $('toets-intro').hidden = false;
    $('toets-start').focus();
  });
  document.querySelectorAll('input[name="bt-n"]').forEach(input => input.addEventListener('change', paintBest));
  $('toets-prev').addEventListener('click', () => { if (current > 0) { current--; render(); } });
  $('toets-next').addEventListener('click', () => { if (current < questions.length - 1) { current++; render(); } else submit(); });
  const dialog = $('toets-lightbox');
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-image]');
    if (button) {
      const img = button.querySelector('img');
      dialog.querySelector('img').src = img.src;
      dialog.querySelector('img').alt = img.alt;
      dialog.querySelector('figcaption').textContent = img.alt;
      dialog.showModal();
    } else if (event.target === dialog || event.target.closest('#toets-close')) dialog.close();
  });
  document.addEventListener('keydown', event => {
    if ($('toets-test').hidden || dialog.open || event.altKey || event.ctrlKey || event.metaKey || event.target.closest('input, textarea, select, [contenteditable="true"], .atlas-account')) return;
    if (event.key === 'ArrowLeft' && current > 0) { event.preventDefault(); current--; render(); }
    if (event.key === 'ArrowRight' && current < questions.length - 1) { event.preventDefault(); current++; render(); }
  });
  init();
})();
</script>
</body>
</html>
