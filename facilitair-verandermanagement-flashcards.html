<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>Flashcards · Facilitair verandermanagement · FM Atlas</title>
<meta name="description" content="Oefen de begrippen van Facilitair verandermanagement met flashcards die je voortgang onthouden op FM Atlas."/>
<link rel="icon" type="image/svg+xml" href="logo.svg"/>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="theme-color" content="#efe5d4"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/atlas.css"/>
<style>
.flashcards { max-width: 960px; }
.flashcards .periods { margin-top: 24px; }
.flashcards .period-btn { height: 44px; flex: none; }
.period-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.fc-progress { margin: 24px 0; }
.fc-progress p { margin-bottom: 10px; font-variant-numeric: tabular-nums; }
.fc-meter { height: 6px; border-radius: var(--r-pill); overflow: hidden; background: var(--glass-strong); }
.fc-meter span { display: block; height: 100%; background: var(--accent); }
.fc-meta, .fc-actions { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin: 20px 0; }
.fc-card { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; min-height: 320px; padding: clamp(24px, 5vw, 56px); border-radius: var(--r-lg); overflow-wrap: anywhere; }
.fc-term { display: block; font-family: var(--font-display); font-size: clamp(28px, 4vw, 44px); font-weight: 700; letter-spacing: -.03em; line-height: 1.12; }
.fc-hint { display: block; margin-top: 24px; font-size: 16px; }
.fc-def { display: block; max-width: 64ch; margin-top: 24px; font-size: clamp(17px, 2vw, 20px); line-height: 1.65; }
.fc-answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
.fc-btn { min-height: 48px; padding: 12px 24px; border-radius: var(--r-pill); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; }
.fc-btn:hover { background: var(--glass-hover); }
.fc-btn-yes { background: var(--accent); color: var(--accent-ink); }
.fc-btn-yes:hover { background: var(--accent); }
.fc-done { border-radius: var(--r-lg); padding: 32px; text-align: center; }
.fc-done h2, .fc-history h2 { font: 700 24px / 1.2 var(--font-display); letter-spacing: -.02em; }
.fc-done p { margin: 16px 0; }
.fc-history { padding: 24px; margin-top: 24px; border-radius: var(--r-lg); }
.fc-history svg { display: block; width: 100%; height: auto; margin-top: 16px; overflow: visible; }
.fc-history p { margin-top: 8px; }
.flashcards [hidden] { display: none; }
@media (max-width: 480px) {
  .fc-btn { padding-inline: 16px; }
  .fc-history { padding: 24px 16px; }
  .fc-card { min-height: 300px; }
  .fc-actions .fc-btn { flex: 1 1 auto; }
}
</style>
</head>
<body>
<div class="scene" aria-hidden="true"><i></i></div>
<header class="topbar" id="topbar"></header>
<main class="page flashcards">
  <h1 class="hero-title">Flashcards</h1>
  <div class="periods glass" id="catFilter" role="group" aria-label="Categorie"></div>
  <div class="fc-progress">
    <p id="progLabel" role="status" aria-live="polite"></p>
    <div class="fc-meter" id="fcMeter" role="progressbar" aria-labelledby="progLabel" aria-valuemin="0" aria-valuenow="0" aria-valuemax="1"><span id="progBar"></span></div>
  </div>
  <div class="fc-meta">
    <p id="cardCounter" role="status" aria-live="polite"></p>
    <button class="fc-btn glass" id="fcProgress" type="button" aria-expanded="false" aria-controls="fcHistory">Voortgang</button>
  </div>
  <section id="fc-main" aria-label="Oefenkaarten">
    <button class="fc-card glass" id="flipWrap" type="button" aria-expanded="false" aria-controls="backDef">
      <span class="fc-term" id="frontTerm"></span>
      <span class="fc-hint" id="flipHint">Tik of druk op spatie voor de definitie</span>
      <span class="fc-def" id="backDef" hidden></span>
    </button>
    <div class="fc-answers" id="fcAnswers" hidden>
      <button class="fc-btn fc-btn-no glass" id="fcNo" type="button">Weet ik niet</button>
      <button class="fc-btn fc-btn-yes" id="fcYes" type="button">Weet ik</button>
    </div>
  </section>
  <section class="fc-done glass" id="fc-done" aria-labelledby="doneTitle" hidden>
    <h2 id="doneTitle" tabindex="-1">Voor vandaag ben je klaar</h2>
    <p id="doneText"></p>
    <button class="fc-btn glass" id="fcRestart" type="button">Verder oefenen</button>
  </section>
  <div class="fc-actions">
    <a class="fc-btn glass" id="fcBrowse" href="facilitair-verandermanagement-begrippen.html">Begrippen bekijken</a>
    <button class="fc-btn glass" id="fcFinish" type="button">Sessie afronden</button>
  </div>
  <section class="fc-history glass" id="fcHistory" aria-labelledby="historyTitle" hidden>
    <h2 id="historyTitle">Gekende kaarten</h2>
    <div id="historyChart"></div>
    <p>De laatste 30 dagen, voor het hele vak.</p>
  </section>
</main>
<script src="js/atlas-data.js"></script>
<script src="js/atlas-account.js"></script>
<script src="js/atlas.js"></script>
<script src="js/data-facilitair-verandermanagement.js"></script>
<script>
(function () {
  'use strict';
  Atlas.topbar('<span class="sep">/</span><a href="vak.html?v=facilitair-verandermanagement">Facilitair verandermanagement</a><span class="sep">/</span><span class="here">Flashcards</span>');
  const account = window.AtlasAccount, key = 'facilitair-verandermanagement', data = window.FVM || {};
  const cards = (data.begrippen || []).map(card => ({ ...card, uid: account.cardId(card) }));
  const cats = data.cats || [], filters = document.getElementById('catFilter');
  const flip = document.getElementById('flipWrap'), answers = document.getElementById('fcAnswers');
  const chart = document.getElementById('fcHistory'), progress = document.getElementById('fcProgress');
  const initial = new URLSearchParams(location.search).get('cat');
  let category = cats.some(c => c.key === initial) ? initial : '';
  let state = account.read(key), queue = [], revealed = false, reviewed = 0, finished = false, stopped = false, updating = false;
  const retries = new Set();
  state.totaal = cards.length;

  [{ key: '', short: 'Alle' }, ...cats].forEach(c => {
    const button = document.createElement('button');
    button.type = 'button'; button.className = 'period-btn'; button.dataset.cat = c.key;
    button.textContent = c.short || c.label;
    button.setAttribute('aria-label', c.label || 'Alle categorieën');
    button.addEventListener('click', () => {
      category = c.key;
      const url = new URL(location.href);
      if (category) url.searchParams.set('cat', category); else url.searchParams.delete('cat');
      history.replaceState(null, '', url);
      start();
      if (!finished) flip.focus({ preventScroll: true });
    });
    filters.appendChild(button);
  });
  const selected = () => category ? cards.filter(card => card.cat === category) : cards;
  function buildQueue() {
    const pool = selected(), now = Date.now();
    const due = pool.filter(card => state.kaarten[card.uid] && (state.kaarten[card.uid].volgende <= now || retries.has(card.uid)));
    due.sort((a, b) => state.kaarten[a.uid].volgende - state.kaarten[b.uid].volgende);
    return [...due, ...pool.filter(card => !state.kaarten[card.uid])];
  }
  function start() {
    state = account.read(key); state.totaal = cards.length;
    queue = buildQueue(); reviewed = 0; finished = false; stopped = false;
    filters.querySelectorAll('button').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.cat === category)));
    document.getElementById('fcBrowse').href = 'facilitair-verandermanagement-begrippen.html' + (category ? '?cat=' + encodeURIComponent(category) : '');
    paintProgress(); showCard();
  }
  function paintProgress() {
    const count = cards.filter(card => state.kaarten[card.uid]?.bak === 3).length;
    document.getElementById('progLabel').textContent = `${count} van ${cards.length} gekend`;
    document.getElementById('progBar').style.width = (cards.length ? count / cards.length * 100 : 0) + '%';
    document.getElementById('fcMeter').setAttribute('aria-valuenow', count);
    document.getElementById('fcMeter').setAttribute('aria-valuemax', Math.max(1, cards.length));
    if (!chart.hidden) drawHistory();
  }
  function showCard() {
    if (!queue.length) { finish(false); return; }
    revealed = false;
    document.getElementById('fc-main').hidden = false;
    document.getElementById('fc-done').hidden = true;
    document.getElementById('fcFinish').hidden = false;
    document.getElementById('cardCounter').textContent = `Nog ${queue.length} ${queue.length === 1 ? 'kaart' : 'kaarten'}`;
    document.getElementById('frontTerm').textContent = queue[0].term;
    document.getElementById('backDef').textContent = queue[0].def;
    document.getElementById('backDef').hidden = true;
    document.getElementById('flipHint').hidden = false;
    answers.hidden = true; flip.setAttribute('aria-expanded', 'false');
  }
  function reveal() {
    if (finished || !queue.length || revealed) return;
    revealed = true;
    document.getElementById('backDef').hidden = false;
    document.getElementById('flipHint').hidden = true;
    answers.hidden = false; flip.setAttribute('aria-expanded', 'true');
  }
  function mark(isKnown) {
    if (!revealed || !queue.length || finished) return;
    const card = queue.shift(), old = state.kaarten[card.uid];
    const bak = isKnown ? Math.min(3, (old?.bak || 1) + 1) : 1;
    const now = Date.now(), following = new Date(now);
    following.setDate(following.getDate() + ({ 1: 1, 2: 3, 3: 5 })[bak]);
    following.setHours(0, 0, 0, 0);
    state.kaarten[card.uid] = { bak, volgende: following.getTime(), laatst: Math.max(now, (old?.laatst || 0) + 1) };
    state.totaal = cards.length;
    updating = true;
    state = account.save(key, state);
    updating = false;
    reviewed++;
    if (isKnown) retries.delete(card.uid);
    else {
      retries.add(card.uid);
      queue.splice(Math.min(3, queue.length), 0, card);
    }
    paintProgress(); showCard();
    if (!finished) flip.focus({ preventScroll: true });
    else document.getElementById('doneTitle').focus({ preventScroll: true });
  }
  function finish(manual) {
    finished = true; stopped = !!manual;
    document.getElementById('fc-main').hidden = true;
    document.getElementById('fc-done').hidden = false;
    document.getElementById('fcFinish').hidden = true;
    document.getElementById('cardCounter').textContent = 'Sessie afgerond';
    document.getElementById('doneTitle').textContent = manual ? 'Sessie afgerond' : selected().length ? 'Voor vandaag ben je klaar' : 'Geen kaarten in deze categorie';
    const upcoming = selected().map(card => state.kaarten[card.uid]?.volgende).filter(n => n > Date.now());
    const nextDate = upcoming.length ? new Intl.DateTimeFormat('nl-NL', { day: 'numeric', month: 'long' }).format(new Date(Math.min(...upcoming))) : '';
    document.getElementById('doneText').textContent = queue.length
      ? `Je hebt ${reviewed} antwoorden gegeven. Er staan nog ${queue.length} kaarten voor je klaar.`
      : `Je hebt ${reviewed} antwoorden gegeven.` + (nextDate ? ` Je volgende herhaling is op ${nextDate}.` : '');
    document.getElementById('fcRestart').hidden = !queue.length;
    showHistory(true);
  }
  function showHistory(open) {
    chart.hidden = !open;
    progress.setAttribute('aria-expanded', String(open));
    if (open) drawHistory();
  }
  function drawHistory() {
    const dates = [];
    for (let i = 29; i >= 0; i--) {
      const date = new Date(); date.setDate(date.getDate() - i);
      dates.push(account.today(date));
    }
    const historical = Object.keys(state.historie).filter(day => day < dates[0]).sort();
    let count = historical.length ? state.historie[historical[historical.length - 1]] : 0;
    const current = cards.filter(card => state.kaarten[card.uid]?.bak === 3).length;
    const values = dates.map(day => {
      if (Object.prototype.hasOwnProperty.call(state.historie, day)) count = state.historie[day];
      return day === account.today() ? current : count;
    });
    const max = Math.max(1, cards.length, ...values);
    const width = Math.max(240, document.getElementById('historyChart').clientWidth);
    const end = width - 24;
    const points = values.map((n, i) => [40 + i * (end - 40) / 29, 156 - n / max * 124]);
    const line = points.map(point => point.join(',')).join(' ');
    const label = day => day.slice(8) + '-' + day.slice(5, 7);
    const description = dates.map((day, i) => `${day}: ${values[i]} gekend`).join('; ');
    document.getElementById('historyChart').innerHTML = `<svg viewBox="0 0 ${width} 196" role="img" aria-labelledby="chartTitle chartDescription">
      <title id="chartTitle">Gekende kaarten per dag in de laatste 30 dagen</title>
      <desc id="chartDescription">${Atlas.esc(description)}</desc>
      <path d="M40 32H${end} M40 156H${end}" fill="none" stroke="var(--ink-soft)" stroke-opacity=".3"/>
      <polygon points="40,156 ${line} ${end},156" fill="var(--accent)" fill-opacity=".12"/>
      <polyline points="${line}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round"/>
      <circle cx="${end}" cy="${points[29][1]}" r="4" fill="var(--highlight)" stroke="var(--ink)"/>
      <g fill="var(--ink)" font-size="14" font-family="var(--font)">
        <text x="32" y="37" text-anchor="end">${max}</text><text x="32" y="161" text-anchor="end">0</text>
        <text x="40" y="186">${label(dates[0])}</text><text x="${end}" y="186" text-anchor="end">${label(dates[29])}</text>
      </g>
    </svg>`;
  }
  flip.addEventListener('click', reveal);
  document.getElementById('fcYes').addEventListener('click', () => mark(true));
  document.getElementById('fcNo').addEventListener('click', () => mark(false));
  progress.addEventListener('click', () => {
    showHistory(chart.hidden);
    if (!finished) flip.focus({ preventScroll: true });
  });
  window.addEventListener('resize', () => { if (!chart.hidden) drawHistory(); });
  document.getElementById('fcFinish').addEventListener('click', () => { finish(true); document.getElementById('doneTitle').focus(); });
  document.getElementById('fcRestart').addEventListener('click', () => { start(); if (!finished) flip.focus(); });
  document.addEventListener('keydown', event => {
    if (event.repeat || event.altKey || event.ctrlKey || event.metaKey || event.target.closest('input, textarea, select, button, a, [contenteditable]')) return;
    if (event.code === 'Space' || event.key === ' ') { event.preventDefault(); reveal(); }
  });
  window.addEventListener('atlas:kaarten', event => {
    if (event.detail.key !== key || updating) return;
    const currentId = queue[0]?.uid, wasRevealed = revealed;
    const oldState = state;
    state = account.read(key); state.totaal = cards.length;
    paintProgress();
    const changed = cards.some(card => JSON.stringify(oldState.kaarten[card.uid]) !== JSON.stringify(state.kaarten[card.uid]));
    if (!changed) return;
    if (event.detail.account) retries.clear();
    // Herhalingen houden hun plek in deze sessie, ook als een ander apparaat iets wijzigt.
    const repeatPositions = queue.map((card, position) => ({ card, position })).filter(({ card }) => retries.has(card.uid));
    retries.forEach(id => {
      if (state.kaarten[id]?.bak !== 1) retries.delete(id);
    });
    queue = buildQueue().filter(card => !retries.has(card.uid));
    repeatPositions.forEach(({ card, position }) => {
      if (retries.has(card.uid)) queue.splice(Math.min(position, queue.length), 0, card);
    });
    const active = queue.findIndex(card => card.uid === currentId);
    if (!event.detail.account && active > 0 && JSON.stringify(oldState.kaarten[currentId]) === JSON.stringify(state.kaarten[currentId])) {
      queue.unshift(queue.splice(active, 1)[0]);
    }
    if (!stopped) {
      finished = false;
      showCard();
      if (queue[0]?.uid === currentId && wasRevealed) reveal();
    } else finish(true);
  });
  if (Object.keys(state.kaarten).length) {
    updating = true; state = account.save(key, state); updating = false;
  }
  start();
})();
</script>
</body>
</html>
